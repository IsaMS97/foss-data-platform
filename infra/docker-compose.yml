services:
  # Bootstrap local certs when the repo cert directory is empty
  certgen:
    image: alpine:3.20
    container_name: certgen
    restart: "no"
    volumes:
      - ./certificates:/certs
      - ./certificates/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    networks:
      - proxy

  # Reverse Proxy
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./certificates:/etc/caddy/certificates:ro
    networks:
      - proxy

  # Docker monitoring
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    expose:
      - "3000" # internal only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
      - ./certificates/combined-ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
    networks:
      - proxy

  # RustFS
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    networks:
      proxy:
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4GB

  # Create the initial object-storage bucket once RustFS is available.
  rustfs-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        mc mb --ignore-existing rustfs/lakehouse
    networks:
      proxy:

  # Lakekeeper

  lakekeeper:
    image: &lakekeeper-image ${LAKEKEEPER__SERVER_IMAGE:-quay.io/lakekeeper/catalog:latest-main}
    pull_policy: &lakekeeper-pull-policy always
    depends_on:
      certgen:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "s3.localhost:host-gateway"
    environment: &lakekeeper-environment
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__OPENID_PROVIDER_URI=https://keycloak.localhost/realms/foss-platform
      - LAKEKEEPER__PG_ENCRYPTION_KEY=${LAKEKEEPER__PG_ENCRYPTION_KEY:-This-is-NOT-Secure!}
      - LAKEKEEPER__OPENID_AUDIENCE=lakekeeper
      - LAKEKEEPER__OPENID_ADDITIONAL_ISSUERS=https://keycloak.localhost/realms/foss-platform
      - LAKEKEEPER__UI__OPENID_CLIENT_ID=lakekeeper
      - LAKEKEEPER__UI__OPENID_PROVIDER_URI=https://keycloak.localhost/realms/foss-platform
      - 'LAKEKEEPER__UI__OPENID_SCOPE=openid profile'
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 3s
    volumes:
      - ./certificates/combined-ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
    expose:
      - "8181"
    networks:
      proxy:

  lakekeeper-bootstrap:
    image: python:3.13-slim
    restart: "no"
    depends_on:
      lakekeeper:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    environment:
      - LAKEKEEPER_BOOTSTRAP_MANAGEMENT_URL=http://lakekeeper:8181/management/v1
      - LAKEKEEPER_BOOTSTRAP_TOKEN_ENDPOINT=https://keycloak.localhost/realms/foss-platform/protocol/openid-connect/token
      - LAKEKEEPER_BOOTSTRAP_CLIENT_ID=spark
      - LAKEKEEPER_BOOTSTRAP_CLIENT_SECRET=spark-local-dev-secret
      - LAKEKEEPER_BOOTSTRAP_SCOPE=openid profile
      - LAKEKEEPER_BOOTSTRAP_WAREHOUSE_NAME=lakehouse
      - LAKEKEEPER_BOOTSTRAP_BUCKET=lakehouse
      - LAKEKEEPER_BOOTSTRAP_REGION=local-01
      - LAKEKEEPER_BOOTSTRAP_ENDPOINT=https://s3.localhost
      - LAKEKEEPER_BOOTSTRAP_KEY_PREFIX=
      - LAKEKEEPER_BOOTSTRAP_USER_NAME=Lakekeeper bootstrap
      - LAKEKEEPER_BOOTSTRAP_USER_EMAIL=lakekeeper-bootstrap@example.local
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "s3.localhost:host-gateway"
    volumes:
      - ./certificates/combined-ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./lakekeeper/bootstrap.py:/bootstrap/bootstrap.py:ro
    entrypoint: ["python", "/bootstrap/bootstrap.py"]
    networks:
      proxy:


  migrate:
    image: *lakekeeper-image
    pull_policy: *lakekeeper-pull-policy
    environment: *lakekeeper-environment
    restart: "no"
    command: [ "migrate" ]
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      proxy:


  db:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 10s
    volumes:
      - volume-lakekeeper:/var/lib/postgresql/data
    networks:
      proxy:

  keycloak-db:
    image: postgres:17
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -p 5432 -d keycloak" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - volume-keycloak:/var/lib/postgresql/data
    networks:
      proxy:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: [ "start-dev", "--import-realm" ]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      - KC_HOSTNAME=keycloak.localhost
      - KC_HOSTNAME_STRICT=false
      - KC_TRUSTED_HOSTS=keycloak.localhost,localhost
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nhost: 127.0.0.1:8080\\r\\nConnection: close\\r\\n\\r\\n\" >&3;grep \"jwks_uri\" <&3",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      proxy:


volumes:
  rustfs_data:
  rustfs_logs:
  dockhand_data:
  caddy_data:
  caddy_config:
  volume-lakekeeper:
  volume-keycloak:


networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
